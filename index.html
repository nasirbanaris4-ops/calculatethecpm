<!-- Light-Themed 3-Option Calculator Card -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-10">
      
      <!-- Option Selector Tabs -->
      <div class="flex flex-wrap gap-2 mb-6 border-b border-slate-200 pb-4">
        <button id="tab-cpm" onclick="switchMode('cpm')" class="px-4 py-2 text-xs font-bold rounded-lg bg-emerald-600 text-white transition">Calculate CPM</button>
        <button id="tab-cost" onclick="switchMode('cost')" class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Calculate Total Cost</button>
        <button id="tab-impressions" onclick="switchMode('impressions')" class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Calculate Impressions</button>
      </div>

      <!-- Input Fields Container -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div id="field-cost">
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Total Ad Cost ($)</label>
          <input type="number" id="cost" placeholder="e.g. 500" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div id="field-cpm" class="hidden">
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Target CPM ($)</label>
          <input type="number" id="cpm" placeholder="e.g. 10" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div id="field-impressions">
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Ad Impressions</label>
          <input type="number" id="impressions" placeholder="e.g. 50000" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
      </div>

      <button id="calculate-btn" onclick="calculate()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition shadow-sm">Calculate Result</button>

      <!-- Light Result Dialog Box -->
      <div id="result-box" class="mt-6 p-5 bg-emerald-50 border border-emerald-200 rounded-xl text-center hidden">
        <span class="text-xs uppercase font-bold text-emerald-700 tracking-wider block mb-1">Calculation Output</span>
        <div id="result-text" class="text-2xl font-black text-emerald-900"></div>
      </div>

    </div>
