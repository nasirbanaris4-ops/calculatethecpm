  <meta property="og:title" content="Contact Us - CPM Calculator Utility">
  <meta property="og:description" content="Contact the calculatethecpm.net team for support or general inquiries.">

  <meta property="og:url" content="https://calculatethecpm.net/contact.html">

  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Schema Markup -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "name": "Contact Us",
    "url": "https://calculatethecpm.net/contact.html",
    "description": "Contact page for calculatethecpm.net support and inquiries."

  </script>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header Navigation -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
      <a href="/index.html" class="flex items-center gap-2 text-xl font-extrabold text-slate-900">
        <span class="bg-emerald-700 text-white px-2 py-0.5 rounded-lg">CPM</span>
        calculatethecpm<span class="text-emerald-700">.net</span>
      </a>
      <nav class="flex flex-wrap gap-2 text-xs font-semibold text-slate-600">
        <a href="/index.html" class="hover:bg-slate-100 px-3 py-1.5 rounded-lg">CPM Calculator</a>
        <a href="/cpc-calculator.html" class="hover:bg-slate-100 px-3 py-1.5 rounded-lg">CPC Calculator</a>
        <a href="/ctr-calculator.html" class="hover:bg-slate-100 px-3 py-1.5 rounded-lg">CTR Calculator</a>
        <a href="/roas-calculator.html" class="hover:bg-slate-100 px-3 py-1.5 rounded-lg">ROAS Calculator</a>
        <a href="/contact.html" class="bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-lg border border-emerald-200">Contact Us</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-xl mx-auto px-4 py-12 flex-grow w-full">
    
    <section class="text-center mb-8">
      <h1 class="text-3xl font-black text-slate-900 mb-2">Contact Us</h1>
      <p class="text-slate-600 text-sm">Have a question or need assistance? Fill out the form below to send us a direct message.</p>
    </section>

    <!-- Clean Contact Form Box -->
    <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-sm">
      <form action="https://formsubmit.co/YOUR_EMAIL@GMAIL.COM" method="POST" class="space-y-4">
        
        <input type="hidden" name="_subject" value="New Contact Form Submission - calculatethecpm.net">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://calculatethecpm.net/contact.html">

        <div>
          <label for="name" class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Full Name</label>
          <input type="text" id="name" name="name" required placeholder="e.g. John Doe" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-slate-800 font-semibold">
        </div>

        <div>
          <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="e.g. john@example.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-slate-800 font-semibold">
        </div>

        <div>
          <label for="subject" class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Subject</label>
          <input type="text" id="subject" name="subject" required placeholder="Enter the subject" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-slate-800 font-semibold">
        </div>

        <div>
          <label for="message" class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Your Message</label>
          <textarea id="message" name="message" rows="4" required placeholder="Write your message here..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-slate-800 font-semibold"></textarea>
        </div>

        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold py-3.5 px-6 rounded-xl shadow-md transition text-sm">Send Message</button>
      </form>
    </div>

  

  <!-- Legal Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
