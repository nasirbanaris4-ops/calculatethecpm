<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Ads CPM Calculator - Calculate GDN & Video CPM</title>
  <meta name="description" content="Calculate Google Display Network (GDN) and YouTube campaign CPM, total ad spend, and required impressions.">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header Navigation -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
      <a href="index.html" class="flex items-center gap-2 group cursor-pointer">
        <div class="bg-blue-600 text-white font-black text-xl px-3 py-1 rounded-lg tracking-wider group-hover:bg-blue-700 transition">CPM</div>
        <span class="text-xl font-extrabold tracking-tight text-slate-900">
          calculatethecpm<span class="text-blue-600 font-bold">.net</span>
        </span>
      </a>

      <nav class="flex flex-wrap gap-1 sm:gap-2 text-xs sm:text-sm font-semibold text-slate-600">
        <a href="index.html" class="hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">CPM Calculator</a>
        <a href="youtube-cpm-calculator.html" class="hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">YouTube CPM</a>
        <a href="tiktok-cpm-calculator.html" class="hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">TikTok CPM</a>
        <a href="facebook-ads-cpm-calculator.html" class="hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Meta Ads</a>
        <a href="google-ads-cpm-calculator.html" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg transition">Google Ads</a>
        <a href="cpm-to-cpc-calculator.html" class="hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">CPM vs CPC</a>
        <a href="roas-calculator.html" class="hover:bg-slate-100 px-3 py-1.5 rounded-lg transition text-green-600">ROAS Calc</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-8 w-full">
    <section class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Google Display & Video Ads CPM Calculator</h1>
      <p class="text-slate-600 text-sm md:text-base">Estimate Google Display Network (GDN) and YouTube campaign costs. Compute target CPM, total budget, or impression goals.</p>
    </section>

    <!-- 3-in-1 Dynamic Calculator Utility Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-12">
      <div class="bg-slate-100 p-3 border-b border-slate-200 flex flex-wrap justify-between items-center gap-3">
        <div class="flex flex-wrap gap-1 md:gap-2">
          <button id="tab-cpm" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white shadow-sm transition">Calculate CPM</button>
          <button id="tab-spend" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-white text-slate-600 hover:bg-slate-200 transition">Calculate Spend</button>
          <button id="tab-impressions" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-white text-slate-600 hover:bg-slate-200 transition">Calculate Impressions</button>
        </div>
        <div class="flex items-center gap-2 text-xs font-semibold text-slate-600">
          <label for="currency">CURRENCY:</label>
          <select id="currency" class="bg-white border border-slate-300 rounded px-2 py-1">
            <option value="USD">USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="GBP">GBP (£)</option>
            <option value="PKR">PKR (Rs)</option>
          </select>
        </div>
      </div>

      <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="space-y-4">
          <div id="field-cost">
            <label class="block text-xs font-bold text-slate-600 mb-1">Total Google Ads Spend ($)</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-slate-400 font-semibold">$</span>
              <input type="number" id="cost" value="500" class="w-full pl-8 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>

          <div id="field-impressions">
            <label class="block text-xs font-bold text-slate-600 mb-1">Total Banner/Ad Impressions</label>
            <input type="number" id="impressions" value="150000" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div id="field-cpm" class="hidden">
            <label class="block text-xs font-bold text-slate-600 mb-1">Target Google Ads CPM ($)</label>
            <input type="number" id="cpm-rate" value="3.33" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <button id="reset-btn" class="text-xs text-slate-500 underline hover:text-slate-800">Reset Inputs</button>
        </div>

        <!-- Dark Background Output Box -->
        <div class="bg-slate-900 text-white p-6 rounded-xl border border-slate-800 flex flex-col justify-between shadow-inner">
          <div>
            <div class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2" id="result-title">GOOGLE DISPLAY ENGINE</div>
            <div class="text-4xl font-extrabold text-blue-400 mb-1" id
